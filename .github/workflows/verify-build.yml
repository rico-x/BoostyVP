name: Verify and build BoostyVP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Tests and five APK variants
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK
        run: bash build-support/install-sdk.sh 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify browser handoff and release tooling
        run: |
          node build-support/test-pairing-brand.mjs
          node --test build-support/release-tools.test.mjs
          bash -n build-support/sign-release.sh
          shellcheck build-support/sign-release.sh
          node build-support/build-pages.mjs
      - name: Unit tests and all instrumentation APKs
        run: ./gradlew testDebugUnitTest :core:domain:test :app:assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2 --no-watch-fs --console=plain
      - name: Build and inspect architecture variants
        run: |
          ./gradlew :app:assembleRelease -PsplitApks=true --no-daemon --max-workers=2 --no-watch-fs --console=plain
          node build-support/release-tools.mjs check-apks app/build/outputs/apk/release
      - name: Upload unsigned APKs for separate signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload device regression APKs (compiled, not executed here)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-regression-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: '**/build/test-results/test*/*.xml'
          if-no-files-found: warn
          retention-days: 14
