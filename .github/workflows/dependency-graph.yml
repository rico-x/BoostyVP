name: Dependency graph
# GitHub cannot read Gradle Kotlin build scripts by itself: without this graph,
# Dependabot alerts and dependency review only see GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['**/*.gradle.kts', 'gradle/**', '.github/workflows/dependency-graph.yml']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK
        run: bash build-support/install-sdk.sh 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph-include-configurations: '.*[Rr]untimeClasspath'
