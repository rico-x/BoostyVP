name: Build and publish BoostyVP
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark this development version as a pre-release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publish-boostyvp
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Releases may only come from main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
  verify:
    needs: guard
    uses: ./.github/workflows/verify-build.yml
    permissions:
      contents: read
  sign:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-apks
          path: unsigned-apks
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install signing tools
        run: bash build-support/install-sdk.sh 'build-tools;35.0.0'
      - name: Restore private signing file
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boostyvp-release.p12"
      - name: Sign, inspect ABIs and verify the persistent certificate
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/boostyvp-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash build-support/sign-release.sh unsigned-apks dist
      - name: Delete temporary private key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/boostyvp-release.p12"
      - name: Attest signed artifacts and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release
          path: dist
      - name: Verify integrity and publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node build-support/release-tools.mjs verify-assets dist
          version="$(node build-support/release-tools.mjs version)"
          tag="v$version"
          notes="release-notes/$tag.md"
          test -s "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::Release exists. Never overwrite published binaries; inspect an unfinished draft or bump the version.'
            exit 1
          fi
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$tag" dist/*.apk dist/SHA256SUMS dist/release-manifest.json --target "$GITHUB_SHA" --title "BoostyVP $version" --notes-file "$notes" --draft "${args[@]}"
          gh release edit "$tag" --draft=false
          printf 'Published [BoostyVP %s](https://github.com/%s/releases/tag/%s)\n' "$version" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
