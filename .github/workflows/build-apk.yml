name: Build and publish BoostyVP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boostyvp-release.jks"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and verify release APK
        id: apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          apk_path="app/build/outputs/apk/release/boostyvp-v${version}.apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -P 16 -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/boostyvp-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk_path" \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$build_tools/apksigner" verify --verbose "$apk_path"
          "$build_tools/zipalign" -c -P 16 4 "$apk_path"
          printf 'version=%s\npath=%s\n' "$version" "$apk_path" >> "$GITHUB_OUTPUT"

      - name: Remove temporary signing files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/boostyvp-release.jks" "$RUNNER_TEMP/app-release-aligned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: boostyvp-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.apk.outputs.version }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "BoostyVP v$APP_VERSION ($tag)" \
            --generate-notes \
            --latest
